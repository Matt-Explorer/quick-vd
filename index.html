<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Call</title>
<style>
  :root{
    --bg1:#ffe3ec; --bg2:#dff3ff; --panel:#ffffff; --accent:#ff8fab; --accent2:#7bc9ff;
    --text:#4a4458; --muted:#9c93ad;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; color:var(--text);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  #screen-join{
    width:100%; max-width:380px; padding:36px 30px; background:var(--panel);
    border-radius:28px; box-shadow:0 20px 50px rgba(155,120,170,.28);
    text-align:center; position:relative;
  }
  .emoji-row{font-size:36px; margin-bottom:6px; letter-spacing:4px;}
  h1{font-size:24px; margin:0 0 6px; color:#5c4b6e;}
  p.sub{color:var(--muted); font-size:14px; margin:0 0 26px; line-height:1.5;}
  input{
    width:100%; padding:15px 18px; font-size:17px; border-radius:16px;
    border:2px solid #ffd6e4; background:#fff9fb; color:var(--text); margin-bottom:16px;
    text-transform:lowercase; text-align:center; font-weight:600;
  }
  input::placeholder{color:#c9bfd6; font-weight:400;}
  input:focus{outline:none; border-color:var(--accent);}
  button{
    width:100%; padding:15px; font-size:17px; font-weight:700; border:none;
    border-radius:16px; color:white; cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 10px 24px rgba(255,143,171,.4);
    transition:transform .15s ease;
  }
  button:hover{transform:translateY(-2px);}
  button:active{transform:translateY(0);}
  .hint{font-size:12.5px; color:var(--muted); margin-top:18px; line-height:1.6;}
  #screen-call{display:none; width:100vw; height:100vh; position:fixed; inset:0; background:#000;}
  #jitsi-container{width:100%; height:100%;}
</style>
</head>
<body>

  <div id="screen-join">
    <div class="emoji-row">💕📞👨‍👩‍👧‍👦</div>
    <h1>Family Call Time!</h1>
    <p class="sub">Pick a secret family code and share it. Anyone who types the same code pops into the same call — just the two of you, or the whole gang.</p>
    <input id="room-code" placeholder="try: sunday-hugs" autocomplete="off" autocapitalize="off">
    <button id="join-btn">💗 Join the call</button>
    <div class="hint">No sign-ups, nothing saved — just say the code out loud (or text it!) and everyone hops in together.</div>
  </div>

  <div id="screen-call">
    <div id="jitsi-container"></div>
  </div>

  <script src="https://meet.jit.si/external_api.js"></script>
  <script>
    const joinScreen = document.getElementById('screen-join');
    const callScreen = document.getElementById('screen-call');
    const input = document.getElementById('room-code');

    function slugify(v){
      return v.trim().toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
    }

    function startCall(code){
      joinScreen.style.display = 'none';
      callScreen.style.display = 'block';
      new JitsiMeetExternalAPI("meet.jit.si", {
        roomName: "call-code-" + code,
        parentNode: document.getElementById('jitsi-container'),
        width: "100%",
        height: "100%",
        configOverwrite: { prejoinPageEnabled: false, disableDeepLinking: true },
        interfaceConfigOverwrite: { SHOW_JITSI_WATERMARK: false, SHOW_WATERMARK_FOR_GUESTS: false }
      });
    }

    document.getElementById('join-btn').addEventListener('click', () => {
      const code = slugify(input.value);
      if (!code) { input.focus(); return; }
      startCall(code);
    });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('join-btn').click(); });
  </script>

</body>
</html>
